<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ant Colony – Prototype</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#120c07;color:#f3e6d3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{position:relative;height:100vh;height:100dvh;width:min(100vw,calc(100dvh*9/16));margin:0 auto;display:flex;flex-direction:column;background:#2b1d12;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #hud{padding:5px 6px 3px;display:flex;flex-direction:column;gap:3px;font-size:12px}
  .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
  .stat{background:#3d2a1a;border-radius:8px;padding:3px 6px;white-space:nowrap}
  .stat b{color:#ffd27a}
  #queenBar{flex:1;height:10px;background:#3d2a1a;border-radius:6px;overflow:hidden;min-width:60px}
  #queenFill{height:100%;width:0;background:linear-gradient(90deg,#c58bff,#ff8be0)}
  #info{min-height:30px;font-size:11.5px;line-height:1.25;color:#e9d6bb;display:flex;align-items:center;gap:6px}
  #lifeBar{width:90px;height:8px;background:#3d2a1a;border-radius:4px;overflow:hidden;display:none}
  #lifeFill{height:100%;background:#7bd36b}
  #wrap{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 12px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
  #bar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px 6px 8px}
  button{font:inherit;font-size:13px;font-weight:600;color:#f3e6d3;background:#4a3320;border:2px solid #6b4a2e;border-radius:12px;min-height:48px;padding:4px 2px;touch-action:manipulation}
  button.on{background:#d79a3e;border-color:#ffd27a;color:#1d1209}
  button:active{transform:scale(.96)}
  #help{font-size:11px;color:#c9b393;text-align:center;padding:0 8px 4px;line-height:1.3}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="row">
      <span class="stat">🐜 <b id="sAnts">0</b></span>
      <span class="stat">🥚 <b id="sEggs">0</b></span>
      <span class="stat">🍃 <b id="sFood">0</b></span>
      <span class="stat">🌤 out <b id="sOut">0</b></span>
      <span class="stat">⏱ <b id="sTime">0:00</b></span>
    </div>
    <div class="row">
      <span class="stat">💀 <b id="sCorpses">0</b></span>
      <span class="stat">🕳 pit <b id="sDisposed">0</b></span>
      <span class="stat">❓ lost <b id="sLost">0</b></span>
      <span class="stat">🍽 starved <b id="sStarved">0</b></span>
    </div>
    <div class="row"><span style="font-size:12px">👑 next egg</span><div id="queenBar"><div id="queenFill"></div></div><span id="queenPct" style="font-size:11px;min-width:34px;text-align:right">0%</span></div>
    <div id="info"><span id="infoText">Tap an ant to select it.</span><div id="lifeBar"><div id="lifeFill"></div></div></div>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="help">Select ants (tap / drag box) → tap tunnel = move, ⛏ mark = dig, grass = forage, 💀 = haul. Dig/Fill/Egg: paint with finger.</div>
  <div id="bar">
    <button id="bAnts" class="on">🐜 Ants</button>
    <button id="bDig">⛏️ Dig</button>
    <button id="bFill">🧱 Fill</button>
    <button id="bEgg">🥚 Egg</button>
    <button id="bSpeed">▶ 1x</button>
    <button id="bAll">All</button>
    <button id="bNone">None</button>
    <button id="bAuto">🤖 Auto</button>
    <button id="bHaul">💀 Haul</button>
    <button id="bNew">↺ New</button>
  </div>
</div>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
